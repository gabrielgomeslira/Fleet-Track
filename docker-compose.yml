services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: ${CONNECTION_STRING}
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Mapa (ADR-0016). Use "-" e nunca ":-": com ":-" o valor vazio vira o padrao e
    # nao ha como desligar o provedor. Nao use repasse sem valor ("- MAP_X"): com a
    # variavel ausente o Compose remove o ENV da imagem e o envsubst deixa "${MAP_X}"
    # literal no mapa.json. As chaves balanceadas de {fontstack} funcionam no padrao.
    environment:
      - MAP_TILEJSON_URL=${MAP_TILEJSON_URL-https://tiles.openfreemap.org/planet}
      - MAP_STYLE_URL=${MAP_STYLE_URL-}
      - MAP_CSP_ORIGINS=${MAP_CSP_ORIGINS-https://tiles.openfreemap.org}
      - MAP_GLYPHS_URL=${MAP_GLYPHS_URL-https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf}
      - MAP_CREDIT=${MAP_CREDIT-OpenFreeMap|https://openfreemap.org;© OpenMapTiles|https://www.openmaptiles.org/}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  pgdata:
