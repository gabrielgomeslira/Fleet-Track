name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pacotes @carbon/* e @ibm/plex-* enviam telemetria no npm install/ci (ADR-0015 §7).
  IBM_TELEMETRY_DISABLED: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Sem senha no repositório: "trust" só vale dentro do runner.
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fleet_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore (travado pelos lockfiles)
        run: dotnet restore Fleet-Track.sln --locked-mode

      - name: Build
        run: dotnet build Fleet-Track.sln -c Release --no-restore

      - name: Testes
        run: dotnet test tests/FleetApi.Tests/FleetApi.Tests.csproj -c Release --no-build
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=fleet_test;Username=postgres

  frontend:
    name: Frontend (lint, typecheck, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        # O Vitest entra com a T-75; até lá o script não existe.
        run: npm test --if-present

      - name: Build
        run: npm run build
